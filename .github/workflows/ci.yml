name: CI

# Pull requests run it directly; release.yml runs it before every release.
on:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retail and Forever TOCs are in sync
        run: python3 .github/scripts/check_tocs.py

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # The client runs Lua 5.1; a file that does not compile takes the whole
      # add-on down at load, so this one blocks the release. The client skips a
      # UTF-8 BOM but luac5.1 doesn't, so it is stripped first.
      - name: Every Lua file compiles
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! sed '1s/^\xEF\xBB\xBF//' "$f" | luac5.1 -p -; then
              echo "::error file=$f::$f does not compile"
              status=1
            fi
          done < <(find . -name '*.lua' -not -path './.git/*' -print0)
          exit $status

      # Informational: the 2009 code base still has style warnings (unused
      # locals and arguments). The undefined-global ones are the interesting
      # part - read_globals is the client's API, so a removed call shows up here.
      - name: luacheck
        uses: nebularg/actions-luacheck@v1
        continue-on-error: true
        with:
          args: --no-color --codes
